<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Calc</title>
    <link rel="icon" href=
            "img/logo-nobg.png"
          type="image/x-icon" />
</head>
<body>
    <header>
        <div class="header">
            <div class="brand">
                <a href="https://github.com/ket3l4" target="_blank" rel="noopener noreferrer">
                    <img class="logo ket3l4" src="img/logo-nobg.png" alt="ket3l4-logo">
                </a>
                <p>ket3l4</p>
            </div>
            <div class="navigation">
                <a href="https://github.com/ket3l4" target="_blank" rel="noopener noreferrer">
                    <img class="logo" src="img/github.png" alt="github">
                </a>
                <a href="https://www.linkedin.com/in/%E6%AC%A3%E5%85%89-%E8%94%A3-232441338/" target="_blank" rel="noopener noreferrer">
                    <img class="logo" src="img/linkedin.png" alt="linkedin">
                </a>
            </div>
        </div>
    
    </header>
    <main>
        <div class="main">
                <div class="left">
                    <p class="title">Pastel Calculator</p>
                    <p class="intro">Give it a try.</p>
                    
                
                </div>
                <div class="right">
                    <div class="calculator">
                        <div class="screen">
                            <div class="oldResult">---</div>
                            <div class="current">0</div>
                            <div class="result"></div>
                            
                            
                        </div>
                
                        <div class="buttons">
                            <button class="button clear">C</button>
                            <button class="button backspace"><-</button>
                            <button class="button ans">ans</button>
                            <button class="button divide">/</button>
                            <button class="button seven">7</button>
                            <button class="button eight">8</button>
                            <button class="button nine">9</button>
                            <button class="button multiply">*</button>
                            <button class="button four">4</button>
                            <button class="button five">5</button>
                            <button class="button six">6</button>
                            <button class="button minus">-</button>
                            <button class="button one">1</button>
                            <button class="button two">2</button>
                            <button class="button three">3</button>
                            <button class="button plus">+</button>
                            <button class="button power">^</button>
                            <button class="button zero">0</button>
                            <button class="button dot">.</button>
                            <button class="button equal">=</button>
                        </div>
                    
                    </div>
                    <div>
                    
                    
                    </div>
                
                </div>
        </div>
    
    </main>
    <footer>
    
    </footer>

</body>
